services:
  db:
    image: postgres:16
    container_name: kapi-sistemi-db

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - kapi-network

  mqtt:
    image: eclipse-mosquitto:latest
    container_name: kapi-sistemi-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped
    networks:
      - kapi-network

  backend:
    build:
      context: ./backend

    container_name: kapi-sistemi-backend

    ports:
      - "${BACKEND_PORT:-3000}:3000"

    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-securelab-development-only-secret}
      PIN_HISTORY_ENCRYPTION_KEY: ${PIN_HISTORY_ENCRYPTION_KEY:-securelab-development-pin-history-key}
      PIN_OTOMATIK_YENILEME: ${PIN_OTOMATIK_YENILEME:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-sistem.yonetici@securelab.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-SecureLab2026!}
      SEED_HOCA_PASSWORD: ${SEED_HOCA_PASSWORD:-BmLab-2026!}
      SEED_BOLUM_BASKANI_EPOSTA: ${SEED_BOLUM_BASKANI_EPOSTA:-halitoztekin@subu.edu.tr}
      APP_BASE_URL: ${APP_BASE_URL:-}
      IZINLI_EPOSTA_ALANLARI: ${IZINLI_EPOSTA_ALANLARI:-subu.edu.tr}
      GECICI_SIFRE_GECERLILIK_SAAT: ${GECICI_SIFRE_GECERLILIK_SAAT:-72}
      AKADEMIK_KADRO_URL: ${AKADEMIK_KADRO_URL:-https://bm.subu.edu.tr/tr/akademik-kadro}
      ALLOW_DEV_PASSWORD_RESET: ${ALLOW_DEV_PASSWORD_RESET:-true}
      # Boş bırakılırsa APP_BASE_URL + /sifre-sifirla.html kullanılır.
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL:-}
      PUBLIC_ISSUE_URL: ${PUBLIC_ISSUE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-}
      # Backend Docker icinden "mqtt" servis adini, ESP32 ise disaridan
      # sunucunun 10.9.2.50 adresini kullanir; ikisi ayni broker'dir.
      MQTT_BROKER_HOST: ${MQTT_BROKER_HOST:-mqtt}
      MQTT_BROKER_PORT: ${MQTT_BROKER_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      FIRMWARE_PUBLIC_BASE_URL: ${FIRMWARE_PUBLIC_BASE_URL:-}
      FIRMWARE_STORAGE_DIR: /app/firmware
      OTA_SIGNING_SECRET: ${OTA_SIGNING_SECRET:-securelab-development-ota-secret}
      OTA_URL_TTL_SECONDS: ${OTA_URL_TTL_SECONDS:-900}

    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started

    restart: unless-stopped

    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/firmware:/app/firmware

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - kapi-network

  frontend:
    build:
      context: ./frontend

    container_name: kapi-sistemi-frontend

    ports:
      # Üniversite güvenlik duvarında web için açılması istenen standart HTTP
      # portu. Farklı bir port gerekiyorsa FRONTEND_PORT ile değiştirilebilir.
      - "${FRONTEND_PORT:-80}:80"

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - kapi-network

  public-form:
    image: nginx:alpine
    container_name: kapi-sistemi-public-form

    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/public-form.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/ogrenci-ariza"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - kapi-network

  qr-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: kapi-sistemi-qr-tunnel
    command: tunnel --no-autoupdate --protocol http2 --url http://public-form:80

    depends_on:
      public-form:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - kapi-network

volumes:
  postgres_data:

networks:
  kapi-network:
    driver: bridge
