server {
    listen 80;
    listen [::]:80;
    server_name _;
    client_max_body_size 5m;
    root /usr/share/nginx/html;
    index login.html;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # QR kodlarinda kullanilacak, yonetim panelinden bagimsiz ogrenci adresi.
    location = /ogrenci-ariza {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        expires -1;
        try_files /ariza-bildir.html =404;
    }

    # HTML sayfalarini tarayici onbelleginde tutmayarak QR formunun her zaman
    # guncel, girissiz surumunun acilmasini sagla.
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        expires -1;
        try_files $uri =404;
    }

    # JS/CSS her yuklemede sunucuya sorulur (degismediyse 304 doner). Aksi halde
    # tarayici eski dosyayi gunlerce onbellekten kullanip yeni panel kodunu
    # calistirmiyordu. location icinde add_header ust duzeyi ezdigi icin tekrarlanir.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /login.html;
    }
}
