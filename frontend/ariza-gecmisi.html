<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arıza Geçmişi · SecureLab | SUBÜ Bilgisayar Mühendisliği</title>
<script src="assets/js/theme-init.js?v=20260927-1"></script>
<link rel="stylesheet" href="assets/css/tokens.css?v=20260927-1">
<link rel="stylesheet" href="assets/css/base.css?v=20260927-1">
<link rel="stylesheet" href="assets/css/layout.css?v=20260927-1">
<link rel="stylesheet" href="assets/css/components.css?v=20260927-1">
<link rel="stylesheet" href="assets/css/subu.css?v=20260927-1">
<link rel="icon" type="image/png" href="assets/img/subu-logo.png">
</head>
<body data-page="ariza-gecmisi" data-breadcrumb="Arıza Geçmişi">
<div class="app-shell">
  <div class="app-body">
    <main class="main-content">
      <div class="page-header">
        <div class="page-header-text">
          <h1 class="page-title">Arıza Geçmişi</h1>
          <p class="page-description">Bildirilen arızaları görüntüleyin ve durumlarını güncelleyin.</p>
        </div>
      </div>

      <section class="card-box">
        <div class="card-box-header">
          <div>
            <div class="card-box-title">Arıza Kayıtları</div>
            <div class="card-box-subtitle" id="faultsCountSubtitle">Yükleniyor…</div>
          </div>
        </div>

        <div class="flex flex-wrap gap-md mb-md">
          <select class="form-control filter-select" id="filterDurum">
            <option value="">Tüm Durumlar</option>
            <option value="OPEN">Açık</option>
            <option value="IN_PROGRESS">İnceleniyor</option>
            <option value="RESOLVED">Çözüldü</option>
          </select>
          <span class="text-meta self-center">Durum rozetine tıklayarak sırayla değiştirebilirsiniz: Açık → İnceleniyor → Çözüldü</span>
        </div>

        <div id="faultsContainer">
          <div class="skeleton-row"><div class="skeleton"></div></div>
          <div class="skeleton-row"><div class="skeleton"></div></div>
          <div class="skeleton-row"><div class="skeleton"></div></div>
        </div>
      </section>
    </main>
  </div>
</div>

<!-- Photo lightbox modal -->
<div class="modal-backdrop" id="photoModal">
  <div class="modal modal-lg" role="dialog" aria-modal="true" aria-labelledby="photoModalTitle">
    <div class="modal-header">
      <div class="modal-title" id="photoModalTitle">Arıza Fotoğrafı</div>
      <button type="button" class="modal-close" data-modal-close aria-label="Kapat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <div class="modal-body">
      <img id="photoModalImg" src="" alt="Arıza fotoğrafı" class="photo-modal-img">
    </div>
  </div>
</div>

<script src="assets/js/api.js?v=20260927-1" defer></script>
<script src="assets/js/theme.js?v=20260927-1" defer></script>
<script src="assets/js/nav.js?v=20260927-1" defer></script>
<script src="assets/js/ui.js?v=20260927-1" defer></script>
<script src="assets/js/ariza-gecmisi.js?v=20260927-1" defer></script>
</body>
</html>
