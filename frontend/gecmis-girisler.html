<head>

<script>(function(){try{var t=localStorage.getItem('securelab-theme');if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="assets/css/tokens.css?v=20260924-1">
<link rel="stylesheet" href="assets/css/base.css?v=20260924-1">

<body data-page="gecmis-girisler" data-breadcrumb="Erişim Geçmişi">
<div class="app-shell">
  <div class="app-body">
    <main class="main-content">
      <div class="page-header">
        <div class="page-header-text">
          <h1 class="page-title">Erişim Geçmişi</h1>
          <p class="page-description">Kapı erişim hareketlerini arayın, filtreleyin ve inceleyin.</p>
        </div>
      </div>

      <section class="card-box">
        <div class="card-box-header">
          <div>
            <div class="card-box-title">Erişim Kayıtları</div>
            <div class="card-box-subtitle" id="recordsCountSubtitle">Yükleniyor…</div>
          </div>
        </div>

        <div class="flex flex-wrap gap-md mb-md">
          <div class="input-group" style="flex: 1 1 240px; min-width: 220px;">
            <input class="form-control" type="search" id="searchInput" placeholder="Kullanıcı adı, e-posta veya kapı ara…">
          </div>
          <select class="form-control" id="filterYontem" style="max-width: 180px;">
            <option value="">Tüm Yöntemler</option>
            <option value="kart">RFID Kart</option>
            <option value="pin">PIN</option>
          </select>
          <select class="form-control" id="filterSonuc" style="max-width: 180px;">
            <option value="">Tüm Sonuçlar</option>
            <option value="izin">İzin verildi</option>
            <option value="red">Reddedildi</option>
          </select>
        </div>

        <div id="recordsContainer">
          <div class="skeleton-row"><div class="skeleton"></div></div>
          <div class="skeleton-row"><div class="skeleton"></div></div>
          <div class="skeleton-row"><div class="skeleton"></div></div>
        </div>

        <div class="pagination" id="pagination" hidden></div>
      </section>
    </main>
  </div>
</div>

<script src="assets/js/api.js?v=20260924-1" defer></script>
