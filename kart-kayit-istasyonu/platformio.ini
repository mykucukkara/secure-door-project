; SecureLab — Kart Kayıt İstasyonu
; ESP32 + MFRC522 (RC522) ile okutulan kartın UID'sini seri porta yazar.
; Web panelindeki "Kart Kayıt" sayfası bu seri çıktıyı (Web Serial) doğrudan okuyabilir.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Seri monitör açıldığında kartın resetlenmemesi için
monitor_dtr = 0
monitor_rts = 0
monitor_filters = direct

build_flags =
    -DMFRC522_SPICLOCK=1000000

lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.11
